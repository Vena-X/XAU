<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vena-X | System Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0f1d;
    --bg-card: #111827;
    --gold: #d4a017;
    --gold-glow: rgba(212, 160, 23, 0.2);
    --text-primary: #ffffff;
    --text-muted: #6b7280;
    --border: #1f2937;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    padding: 20px;
  }

  /* Background Grid Effect */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.15;
    z-index: 1;
  }

  .maintenance-container {
    position: relative;
    z-index: 2;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 30px;
    text-align: center;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 40px var(--gold-glow);
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--text-primary);
    margin-bottom: 5px;
  }

  .logo span {
    color: var(--gold);
    text-shadow: 0 0 10px var(--gold);
  }

  .version-badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    background: rgba(212, 160, 23, 0.1);
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 2px 10px;
    border-radius: 20px;
    margin-bottom: 30px;
    font-weight: 700;
  }

  /* Animated Spinner */
  .gear-wrapper {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 30px auto;
  }

  .spinner-ring {
    width: 100%;
    height: 100%;
    border: 4px dashed var(--gold);
    border-radius: 50%;
    animation: rotate 8s linear infinite;
  }

  .inner-pulse {
    position: absolute;
    top: 15%; left: 15%; width: 70%; height: 70%;
    background: var(--gold-glow);
    border-radius: 50%;
    animation: pulse 2s infinite ease-in-out;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
  }

  p {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 25px;
  }

  .status-footer {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    font-size: 14px;
    color: var(--text-muted);
  }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background-color: #e67e22; /* Amber orange color for maintenance */
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px #e67e22;
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(0.9); opacity: 0.4; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }
</style>
</head>
<body>

<div class="maintenance-container">
  <div class="logo">VENA-<span>X</span></div>
  <div class="version-badge">UPGRADING TO V1.4v</div>
  
  <div class="gear-wrapper">
    <div class="spinner-ring"></div>
    <div class="inner-pulse"></div>
  </div>

  <h1>System Under Maintenance</h1>
  <p>We are currently updating our systems and implementing new features to improve your trading intelligence experience. We will be back online shortly.</p>
  
  <div class="status-footer">
    <span class="status-dot"></span> Current Status: Scheduled Upgrades
  </div>
</div>

</body>
</html>
